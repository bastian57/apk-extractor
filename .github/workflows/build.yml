name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          test -s /tmp/gradle.zip || { echo "Gradle download FAILED"; exit 1; }
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        run: |
          /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk || { echo "APK NOT PRODUCED"; exit 1; }
          ls -l app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK uniquely
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk ApkExtractor-v1.0.0.apk

      - name: Publish rolling release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: ApkExtractor-v1.0.0.apk
