// Top-level build file
// Catatan: repositories untuk dependency HANYA di settings.gradle
// (dependencyResolutionManagement). Jangan tambah allprojects { repositories }
// karena repositoriesMode = FAIL_ON_PROJECT_REPOS akan menggagalkan build.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
